name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run go vet
        run: go vet ./...

      - name: Run unit and handler tests with race detection
        run: go test -race -count=1 -timeout=2m ./...

      - name: Build application
        run: go build ./cmd/car_service

  concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start isolated test databases and migrations
        run: |
          docker compose -p car-service-tests -f deployment/docker/docker-compose.test.yml up -d --wait --wait-timeout 120 postgres redis
          docker compose -p car-service-tests -f deployment/docker/docker-compose.test.yml run --rm migrate
      - name: Concurrent API tests with race detection
        run: go test -race -tags=integration,load ./test -run '^TestConcurrent' -count=1 -timeout=2m -v
      - name: CRUD, optional fields and migration round-trip tests
        run: go test -race -tags=integration ./... -count=1 -timeout=2m
      - name: Bounded load smoke tests
        run: go test -tags=integration,load ./test -run '^TestLoad' -count=1 -timeout=2m -v
      - name: Database diagnostics on failure
        if: failure()
        run: docker compose -p car-service-tests -f deployment/docker/docker-compose.test.yml logs --no-color --tail=100
      - name: Stop test dependencies
        if: always()
        run: docker compose -p car-service-tests -f deployment/docker/docker-compose.test.yml down -v

  publish:
    needs: [test, concurrency]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Choose image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
